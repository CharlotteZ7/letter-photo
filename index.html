<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="theme-color" content="#e6ecf7" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="format-detection" content="telephone=no" />
<meta property="og:title" content="给蒋生的一封信" />
<meta property="og:description" content="没想到吧，其实我一直在你身边。" />
<title>给蒋生的一封信 ✉️</title>
<link rel="preload" as="image" href="./asset/bg-letter.jpg?v=2" />
<link rel="stylesheet" href="./style.css" />
</head>
<body>

  <!-- 第三段（字卡墙）的背景图：中间完整图 + 上下模糊铺底 -->
  <div class="wall-bg" id="wallBg" aria-hidden="true">
    <div class="wall-photo">
      <img src="./asset/bg-letter.jpg?v=2" alt="" decoding="async" />
    </div>
  </div>

  <!-- 背景装饰：星星 + 花瓣（JS 生成） -->
  <div class="decor" id="decor" aria-hidden="true"></div>

  <!-- 第一屏：欢迎 -->
  <section class="screen" id="welcome">
    <div class="card">
      <div class="welcome-emoji">💝</div>
      <h1 class="welcome-title">Hi, 蒋伯驾！</h1>
      <p class="welcome-msg">没想到吧，其实我一直在你身边</p>
      <button class="btn" id="startBtn" type="button">开始查看 ✨</button>
    </div>
  </section>

  <!-- 第二屏：指纹验证 -->
  <section class="screen" id="scan" hidden>
    <div class="card">
      <div class="scan-icon">👆</div>
      <h2 class="scan-title">请验证指纹</h2>
      <p class="scan-quote">“虽然剧本里的故事结束了，但我们之间的故事没有结束”</p>

      <div class="print-box" id="printBox">
        <svg class="ring" viewBox="0 0 120 120" aria-hidden="true">
          <circle class="ring-bg" cx="60" cy="60" r="54" />
          <circle class="ring-fg" id="ringFg" cx="60" cy="60" r="54" />
        </svg>

        <svg class="fingerprint" viewBox="0 0 100 100" aria-hidden="true">
          <defs>
            <linearGradient id="fpGrad" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#8fe3e0" />
              <stop offset="100%" stop-color="#ffc3d6" />
            </linearGradient>
          </defs>
          <g fill="none" stroke="url(#fpGrad)" stroke-width="3.2" stroke-linecap="round"
             transform="translate(50 50) scale(1 1.12) rotate(-6)">
            <circle cx="0" cy="0"    r="7"  stroke-dasharray="30 10" />
            <circle cx="0" cy="0.6"  r="14" stroke-dasharray="62 12" stroke-dashoffset="-8" />
            <circle cx="0" cy="1.8"  r="21" stroke-dasharray="96 14" stroke-dashoffset="-20" />
            <circle cx="0" cy="3.2"  r="28" stroke-dasharray="130 16" stroke-dashoffset="-34" />
            <circle cx="0" cy="5"    r="35" stroke-dasharray="165 18" stroke-dashoffset="-50" />
            <circle cx="0" cy="7.2"  r="41" stroke-dasharray="190 22" stroke-dashoffset="-70" />
          </g>
        </svg>

        <span class="ripple" id="ripple" aria-hidden="true"></span>
      </div>

      <p class="scan-hint">💡 提示：长按指纹 1.5 秒完成验证</p>
    </div>
  </section>

  <!-- 背景音乐开关（开始后出现；没有音乐文件会自动隐藏） -->
  <button class="music-btn" id="musicBtn" type="button" aria-label="背景音乐" hidden>
    <span></span><span></span><span></span>
  </button>

  <!-- 背景音乐：把音乐文件放到 asset/bgm.mp3 或 asset/bgm.m4a 即可 -->
  <audio id="bgm" loop preload="metadata">
    <source src="./asset/bgm.mp3" type="audio/mpeg" />
    <source src="./asset/bgm.m4a" type="audio/mp4" />
  </audio>

  <script src="./script.js"></script>
</body>
</html>
